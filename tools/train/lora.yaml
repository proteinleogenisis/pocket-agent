# mlx_lm.lora -c lora.yaml   (run from the folder holding data/)
model: Qwen/Qwen2.5-0.5B-Instruct
train: true
data: data
fine_tune_type: lora
num_layers: -1          # every layer
batch_size: 8
iters: 2400
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [5.0e-5, 2400, 5.0e-6]
mask_prompt: true       # learn the answers, not the questions
max_seq_length: 1024
grad_checkpoint: true
steps_per_report: 50
steps_per_eval: 300
save_every: 600
adapter_path: adapters
seed: 0
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj", "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
  rank: 32
  scale: 20.0
  dropout: 0.05
