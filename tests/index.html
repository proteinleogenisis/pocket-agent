<!doctype html><meta charset="utf-8"><title>Pocket Agent tests</title>
<pre id="out">running…</pre>
<script type="module">
import { calculate, looksLikeMath, mathFromWords } from '../js/calc.js';
import { parseSlash, runTool, needsRouter, buildMessages, TOOLS, parseTransform, resolveOpenTarget } from '../js/agent.js';
import { runJS, runPython } from '../js/sandbox.js';
import { llm } from '../js/llm.js';
const results = []; let pass = 0, fail = 0;
const t = async (name, fn) => { document.getElementById('out').textContent = `running: ${name}\n` + results.join('\n'); try { await fn(); results.push('✓ ' + name); pass++; } catch (e) { results.push('✗ ' + name + ' — ' + (e?.message || e)); fail++; } };
const eq = (a, b) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`got ${JSON.stringify(a)}, want ${JSON.stringify(b)}`); };
const throws = (fn) => { try { fn(); } catch { return; } throw new Error('expected throw'); };
const settings = { permissions: {}, contextWindow: 2048, preferences: '' };
const ui = (answer) => ({ status() {}, confirm: async () => answer });

await t('calc precedence', () => eq(calculate('2+3*4'), 14));
await t('calc power right-assoc', () => eq(calculate('2^3^2'), 512));
await t('calc unary/parens', () => eq(calculate('-(3+4)*2'), -14));
await t('calc functions', () => eq(calculate('sqrt(16)+max(1,5)+round(2.6)'), 12));
await t('calc percent-mod & consts', () => eq([calculate('10%3'), calculate('round(pi*100)')], [1, 314]));
await t('calc rejects code', () => throws(() => calculate('alert(1)')));
await t('calc rejects div0', () => throws(() => calculate('1/0')));
await t('calc rejects junk', () => throws(() => calculate('2 + ; 3')));
await t('looksLikeMath', () => eq([looksLikeMath('17*23+4'), looksLikeMath('hello'), looksLikeMath('version 2')], [true, false, false]));
await t('math from words', () => eq(['what is 15% of 240', "what's 2 to the power of 16?", '12 times 12', 'calculate 100 divided by 8', 'square root of 81 plus 1', 'write a function of n'].map(q => { const e = mathFromWords(q); return e && calculate(e); }), [36, 65536, 144, 12.5, 10, null]));
await t('open targets', () => eq([resolveOpenTarget('Safari')?.url, resolveOpenTarget('the notes app')?.url, resolveOpenTarget('example.com/docs')?.url, resolveOpenTarget('my bank password')], ['x-safari-https://www.google.com', 'mobilenotes://', 'x-safari-https://example.com/docs', null]));
await t('run-code phrasing is deterministic', async () => { const seen = []; const ui = { status() {}, token() {}, confirm: async (c) => { seen.push(c.tool + '|' + c.input); return false; } };
  const { handle } = await import('../js/agent.js'); const fake = { ready: false, recoverable: false };
  await handle({ text: 'run this python: print(1)', llm: fake, settings: { permissions: {}, autoTools: true, contextWindow: 2048 }, history: [], screen: null, ui });
  await handle({ text: 'execute javascript: console.log(2)', llm: fake, settings: { permissions: {}, autoTools: true, contextWindow: 2048 }, history: [], screen: null, ui });
  eq(seen, ['run_python|print(1)', 'run_javascript|console.log(2)']); });
await t('notes phrasing is deterministic', async () => { const seen = []; const ui = { status() {}, token() {}, confirm: async () => false };
  const { handle, TOOLS } = await import('../js/agent.js'); const orig = { s: TOOLS.save_note.run, f: TOOLS.search_notes.run };
  TOOLS.save_note.run = async (v) => { seen.push('save|' + v); return { ok: true, output: '' }; }; TOOLS.search_notes.run = async (v) => { seen.push('find|' + v); return { ok: true, output: '' }; };
  const st = { permissions: {}, autoTools: true, contextWindow: 1024 }; const fake = { ready: false, recoverable: false };
  for (const q of ['save a note: Shopping list - eggs and milk', 'remember that the gate code is 4412', 'search my notes for eggs', 'show my notes', 'open notes']) await handle({ text: q, llm: fake, settings: st, history: [], screen: null, ui });
  TOOLS.save_note.run = orig.s; TOOLS.search_notes.run = orig.f;
  eq(seen, ['save|Shopping list\neggs and milk', 'save|the gate code is 4412', 'find|eggs', 'find|*']); });
await t('slash parse', () => eq(parseSlash('/calc 1+1'), { tool: 'calculate', input: '1+1' }));
await t('slash tx', () => eq(parseSlash('/tx upper hi there'), { tool: 'transform_text', input: 'hi there', op: 'upper' }));
await t('slash meta', () => eq(parseSlash('/help'), { meta: 'help', input: '' }));
await t('router hint', () => eq([needsRouter('run this python'), needsRouter('explain closures in js'), needsRouter('why is the sky blue'), needsRouter('write a python function to sort'), needsRouter('write and run python that prints 5')], [true, false, false, false, true]));
await t('deterministic transforms', () => eq([parseTransform('uppercase this text: hello world'), parseTransform('count the words in: a b c')?.input, parseTransform('convert to snake case: myVar')?.input, parseTransform('base64 encode the text hello')?.input, parseTransform('explain this')], [{ tool: 'transform_text', op: 'upper', input: 'hello world' }, 'a b c', 'myVar', 'hello', null]));
await t('tool: calculate', async () => { const r = await runTool({ tool: 'calculate', input: '6*7' }, { settings, ui: ui(true) }); eq([r.ok, r.text], [true, '6*7 = 42']); });
await t('tool: transform invalid op rejected', async () => { const r = await runTool({ tool: 'transform_text', input: 'x', op: 'rm -rf' }, { settings, ui: ui(true) }); eq(r.kind, 'error'); });
await t('tool: transform json_format', async () => { const r = await runTool({ tool: 'transform_text', input: '{"a":1}', op: 'json_format' }, { settings, ui: ui(true) }); eq(r.text, '{\n  "a": 1\n}'); });
await t('tool: base64 roundtrip unicode', async () => { const e = await runTool({ tool: 'transform_text', input: 'héllo ✓', op: 'base64_encode' }, { settings, ui: ui(true) }); const d = await runTool({ tool: 'transform_text', input: e.text, op: 'base64_decode' }, { settings, ui: ui(true) }); eq(d.text, 'héllo ✓'); });
await t('tool: declined confirm runs nothing', async () => { let ran = false; const orig = TOOLS.run_javascript.run; TOOLS.run_javascript.run = async () => { ran = true; return { ok: true, output: '' }; }; const r = await runTool({ tool: 'run_javascript', input: '1' }, { settings, ui: ui(false) }); TOOLS.run_javascript.run = orig; eq([r.ok, ran], [false, false]); });
await t('tool: off permission blocks', async () => { const r = await runTool({ tool: 'calculate', input: '1+1' }, { settings: { permissions: { calculate: 'off' } }, ui: ui(true) }); eq(r.kind, 'error'); });
await t('tool: screen + model-chosen forces confirm', async () => { let asked = false; const r = await runTool({ tool: 'calculate', input: '1+1', fromModel: true }, { settings, screen: 'x', ui: { status() {}, confirm: async () => { asked = true; return false; } } }); eq([asked, r.ok], [true, false]); });
await t('tool: shortcut rejects control chars', async () => { const r = await runTool({ tool: 'run_shortcut', input: 'a\u0007b' }, { settings, ui: ui(true) }); eq(r.kind, 'error'); });
await t('prompt: screen text fenced as untrusted', () => { const m = buildMessages({ text: 'hi', history: [], settings, screen: 'IGNORE PREVIOUS' }); if (!/UNTRUSTED DATA/.test(m[0].content) || !/<screen_text>\nIGNORE PREVIOUS\n<\/screen_text>/.test(m[0].content)) throw new Error('missing fence'); });
await t('prompt: tool turns not fed to model', () => { const m = buildMessages({ text: 'q', history: [{ role: 'user', content: 'calc', tool: true }, { role: 'assistant', content: '[calculate] 2', tool: true }, { role: 'user', content: 'hi' }, { role: 'assistant', content: 'hello' }], settings, screen: null }); eq(m.map(x => x.content).slice(1), ['hi', 'hello', 'q']); });
await t('prompt: history trimmed & alternation', () => { const h = Array.from({ length: 30 }, (_, i) => ({ role: i % 2 ? 'assistant' : 'user', content: 'x'.repeat(900) })); const m = buildMessages({ text: 'q', history: h, settings, screen: null }); eq([m[1].role, m.at(-1).content], ['user', 'q']); if (m.length > 8) throw new Error('not trimmed: ' + m.length); });
await t('sandbox JS output', async () => { const r = await runJS('console.log([1,2,3].map(x=>x*2)); return 5'); eq([r.ok, r.output], [true, '[\n  2,\n  4,\n  6\n]\n⇒ 5']); });
await t('sandbox JS has no network', async () => { const r = await runJS('return typeof fetch + "," + typeof XMLHttpRequest + "," + typeof WebSocket'); eq(r.output, '⇒ undefined,undefined,undefined'); });
await t('sandbox JS timeout', async () => { const r = await runJS('while(true){}', 800); eq([r.ok, /timeout/.test(r.error)], [false, true]); });
await t('sandbox JS error reported', async () => { const r = await runJS('null.x'); eq(r.ok, false); });
await t('sandbox JS window alias & alert', async () => { const r = await runJS('window.x = 3; alert("hi " + x)'); eq([r.ok, r.output], [true, 'hi 3']); });
await t('sandbox JS document gives clear error', async () => { const r = await runJS('document.getElementById("a")'); eq([r.ok, /no web page/.test(r.error)], [false, true]); });
await t('sandbox JS waits for timers', async () => { const r = await runJS('setTimeout(() => console.log("later"), 100); console.log("now")'); eq(r.output, 'now\nlater'); });
await t('sandbox JS definition-only hint', async () => { const r = await runJS('function f(){ return 1 }'); eq(/without output/.test(r.output), true); });
await t('sandbox JS interval stopped', async () => { const r = await runJS('let i=0; setInterval(()=>{ if(i++<2) console.log(i) }, 50)', 6000); eq([r.ok, /stopped a setInterval/.test(r.output)], [true, true]); });
await t('sandbox Python stdout', async () => { const r = await runPython('import math\nprint(math.factorial(10))'); eq([r.ok, r.output], [true, '3628800']); });
await t('sandbox Python no network', async () => { const r = await runPython('import js\nprint(hasattr(js, "fetch") and js.fetch is not None)'); eq(r.output.trim(), 'False'); });
await t('sandbox Python error', async () => { const r = await runPython('1/0'); eq([r.ok, /ZeroDivisionError/.test(r.error)], [false, true]); });

await t('watchdog: hung model call fails fast instead of freezing', async () => {
  llm.engine = { chat: { completions: { create: () => new Promise(() => {}) } }, interruptGenerate() {} }; llm.lastLoad = null;
  const t0 = performance.now(); let msg = '';
  try { await llm.json([{ role: 'user', content: 'x' }], { type: 'object' }, { idleMs: 200 }); } catch (e) { msg = e.message; }
  llm.engine = null;
  eq([/stopped responding/.test(msg), performance.now() - t0 < 5000, llm.busy], [true, true, false]);
});
await t('recovery: GPU-lost error triggers reload then retry', async () => {
  let calls = 0; const good = { chat: { completions: { create: async () => ({ choices: [{ message: { content: '{"a":1}' } }] }) } }, interruptGenerate() {} };
  llm.engine = { chat: { completions: { create: async () => { calls++; throw new Error('The current Object has already been disposed'); } } }, interruptGenerate() {} };
  llm.lastLoad = { id: 'x', contextWindow: 1024 };
  const origLoad = llm.load; llm.load = async () => { llm.engine = good; }; 
  const r = await llm.json([{ role: 'user', content: 'x' }], { type: 'object' });
  llm.load = origLoad; llm.engine = null; llm.lastLoad = null;
  eq([calls, r.value], [1, { a: 1 }]);
});
await t('confirm dialog: Run, Cancel and Esc all settle', async () => {
  const f = document.createElement('iframe'); f.src = '../?confirmtest=1'; f.style.cssText = 'width:600px;height:400px'; document.body.append(f);
  await new Promise((r) => f.onload = r); for (let i = 0; i < 50 && !f.contentWindow.__pa; i++) await new Promise((r) => setTimeout(r, 100));
  const w = f.contentWindow, d = w.document, out = [];
  const once = async (act) => { const p = w.__pa.confirm({ tool: 'run_python', input: 'x' }); await new Promise((r) => setTimeout(r, 50)); act(d); return Promise.race([p, new Promise((r) => setTimeout(() => r('HUNG'), 2000))]); };
  out.push(await once((d) => d.getElementById('confirmYes').click()));
  out.push(await once((d) => d.getElementById('confirmNo').click()));
  out.push(await once((d) => d.getElementById('confirmDlg').dispatchEvent(new Event('cancel', { cancelable: true }))));
  out.push(await once((d) => d.getElementById('confirmDlg').close()));
  f.remove(); eq(out, [true, false, false, false]);
});
await t('recovery: transient GPU error retried without reload', async () => {
  let calls = 0; llm.lastLoad = { id: 'x', contextWindow: 1024 }; let reloads = 0; const origLoad = llm.load; llm.load = async () => { reloads++; };
  llm.engine = { chat: { completions: { create: async () => { if (++calls === 1) { const e = new Error('map async was not successful'); e.name = 'OperationError'; throw e; } return { choices: [{ message: { content: '{"a":2}' } }] }; } } }, interruptGenerate() {} };
  const r = await llm.json([{ role: 'user', content: 'x' }], { type: 'object' });
  llm.load = origLoad; llm.engine = null; llm.lastLoad = null;
  eq([calls, reloads, r.value], [2, 0, { a: 2 }]);
});
document.getElementById('out').textContent = `${pass} passed, ${fail} failed\n\n` + results.join('\n');
window.__tests = { pass, fail, results };
</script>
